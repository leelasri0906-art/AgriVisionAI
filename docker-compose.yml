services:
  db:
    image: postgres:16
    container_name: agrivision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrivision
      POSTGRES_USER: agrivision
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - agrivision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrivision -d agrivision"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agrivision_pgdata:
